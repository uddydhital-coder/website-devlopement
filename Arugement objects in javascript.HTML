<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arugement objects in JS</title>
</head>
<body>
    <p>Finding the largest number with help of aurgement objects</p>
    <p id="result"></p>
    <script>
    function findMax() {
        var i;
        var max=0;
        for(i=0;i<arguments.length; i++) {
            if (arguments[i]>max) {
                max=arguments[i];
            }
        }
        return max;
    }
    document.getElementById("result").innerHTML=findmax(40, 5, 6)
    </script>
</body>
</html>
