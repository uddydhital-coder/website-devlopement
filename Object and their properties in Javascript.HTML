<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object and thier properties in js</title>
</head>
<body>
    <h2>Javascript objects and its properties</h2>
    <p>there are 2 different ways to access an object property</p>
    <p id="demo"></p>
    <script>
        //Create an object:
        var person = {
            firstName: "Udgam",
            age: 14
        };
        //Display some data from the object:
        document.getElementById("demo").innerHTML = person.firstName + " is " + person.age + " years old";
    </script>
</body>
</html>
