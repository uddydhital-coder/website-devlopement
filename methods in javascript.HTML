<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods in javascript</title>
</head>
<body>
    <h2>Javascript string methods</h2>
    <p>Basic methods</p>
    <script>
        var str ="AmAzIng"
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>")
        document.write(str.startswith('A'));
        document.write("<br>")
        //test method-> returns true or false
        var str1 = "I learnt new methods";
        var patt = new RegExp("I");
        var res = patt.test(str1);
        document.write(res);
    </script>
</body>
</html>
